name: Speedcube diff cleanup
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  cleanup-speedcube-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/speedcube-5.59.0
          fetch-depth: 0
      - name: Normalize release diff
        run: |
          git fetch origin main
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          docs = Path('docs')

          # Rebuild changelog using the repo's previous JSON serialization style.
          base = subprocess.check_output(['git','show','origin/main:docs/changelog.json'], text=True)
          data = json.loads(base)
          data = [x for x in data if x.get('version') != '5.59.0']
          data.insert(0, {
            'version':'5.59.0',
            'date':'2026-08-18',
            'changes':[
              'Added Speedcube — a dedicated 3×3 cube screen built just for watching satisfying solves.',
              'Scrambles use legal face turns and Solve reverses the exact sequence with animated moves.',
              'Added drag-to-orbit controls plus Chill, Normal, and Speedcuber move speeds.',
              'Added Speedcube to the DAWG menu and offline app cache.'
            ]
          })
          (docs/'changelog.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          # Start from main's SW so only cache + cube precache change.
          sw = subprocess.check_output(['git','show','origin/main:docs/sw.js'], text=True)
          sw, n = re.subn(r'const CACHE\s*=\s*"slawminyaw-v474";', 'const CACHE      = "slawminyaw-v475";', sw, count=1)
          assert n == 1, 'SW cache bump failed'
          if '"./cube.html"' not in sw:
              sw = sw.replace('  "./changelog.json",', '  "./changelog.json",\n  "./cube.html",', 1)
          (docs/'sw.js').write_text(sw, encoding='utf-8')
          PY
          git config user.name "Budget DAWGs Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/changelog.json docs/sw.js
          git commit -m "Normalize Speedcube release diff" || exit 0
          git push origin HEAD:agent/speedcube-5.59.0
