plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cgrant10.budgetdawgs'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cgrant10.budgetdawgs'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
